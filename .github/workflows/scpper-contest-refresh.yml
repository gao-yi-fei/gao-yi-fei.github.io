name: Refresh SCPPER Contest Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: scpper-sync
  cancel-in-progress: false

jobs:
  refresh-contest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCPPER_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-wikidot-crawler.txt
      - name: Install crawler dependencies
        run: python -m pip install -r tools/requirements-wikidot-crawler.txt
      - name: Refresh live contest snapshot
        run: python tools/refresh_contest_snapshot.py --workers 12 --timeout 20 --retries 2
      - name: Commit live contest snapshot
        run: |
          git config user.name "piglin-site-bot"
          git config user.email "piglin-site-bot@users.noreply.github.com"
          git add data/home-index.json.gz data/recent-index.json.gz data/recent-head.json data/contest-live.json
          if git diff --cached --quiet; then
            echo "No contest changes."
          else
            git commit -m "Refresh SCPPER contest snapshot"
            git push
          fi
