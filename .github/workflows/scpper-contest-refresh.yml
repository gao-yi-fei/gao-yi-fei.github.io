name: Incremental SCPPER Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: scpper-sync
  cancel-in-progress: false

jobs:
  refresh-contest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCPPER_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-wikidot-crawler.txt
      - name: Install crawler dependencies
        run: python -m pip install -r tools/requirements-wikidot-crawler.txt
      - name: Synchronize changed Wikidot objects
        run: python tools/incremental_sync_scpper.py --workers 16 --timeout 20 --retries 2
      - name: Commit incremental sync
        run: |
          git config user.name "piglin-site-bot"
          git config user.email "piglin-site-bot@users.noreply.github.com"
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git add data tools .github
          if git diff --cached --quiet; then
            echo "No incremental changes."
          else
            git commit -m "Incremental SCPPER sync"
            git push
          fi
